# Items for the Crystal Mountain campaign
slots:
  weapon:
    max_items: 1
  head:
    max_items: 1
  armor:
    max_items: 1

items:
  basic_sword:
    name: "Basic Sword"
    description: "A simple sword for beginners."
    attributes:
      PHYSICAL_DAMAGE: 5
    requirements:
      STRENGTH: 1
    slot: weapon
    sprite: basic_sword
  claymore:
    name: "Claymore"
    description: "A large two-handed sword."
    attributes:
      PHYSICAL_DAMAGE: 10
      CRITICAL_CHANCE: 2
    requirements:
      STRENGTH: 5
    slot: weapon
    sprite: claymore
  great_sword:
    name: "Great Sword"
    description: "A massive sword for the strongest warriors."
    attributes:
      PHYSICAL_DAMAGE: 15
      CRITICAL_CHANCE: 5
    requirements:
      STRENGTH: 10
    slot: weapon
    sprite: great_sword
  basic_helm:
    name: "Basic Helm"
    description: "A simple helmet for protection."
    attributes:
      ARMOR: 2
    requirements:
      STRENGTH: 1
    slot: head
    sprite: basic_helm
  knight_helm:
    name: "Knight Helm"
    description: "A sturdy helmet for knights."
    attributes:
      ARMOR: 5
      STRENGTH: 2
    requirements:
      STRENGTH: 3
    slot: head
    sprite: knight_helm
  basic_staff:
    name: "Basic Staff"
    description: "A simple staff for beginner mages."
    attributes:
      MAGICAL_DAMAGE: 5
      INSIGHT: 2
    requirements:
      INSIGHT: 3
    slot: weapon
    sprite: basic_staff