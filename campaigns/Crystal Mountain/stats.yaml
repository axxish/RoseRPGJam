primary_attributes:
  STRENGTH:
    default: 1
  DEXTERITY:
    default: 1
  INSIGHT:
    default: 1
  LUCK:
    default: 1

combat:
  MAX_HEALTH:
    default: 100
    formula: "100 + 10 * (level - 1) + 2 * STRENGTH"
  MAX_MANA:
    default: 50
    formula: "50 + 5 * (level - 1) + 1.5 * INSIGHT"
  HEALTH_REGEN:
    default: 1
    formula: "1 + 0.1 * (level - 1) + 0.05 * INSIGHT"
  HEALTH:
    default: "MAX_HEALTH"
    dieOnZero: true
  ARMOR:
    default: 0
    formula: "0 + 0.1 * (level - 1) + 0.2 * DEXTERITY"
  MANA:
    default: "MAX_MANA"
  CRITICAL_CHANCE:
    default: 5
    formula: "5 + 0.2 * LUCK"
  CRITICAL_DAMAGE_MULTIPLIER:
    default: 1.5

damage_types:
  PHYSICAL_DAMAGE:
    default: 10
    formula: "10 + 2 * (level - 1) + 0.5 * STRENGTH"
  MAGICAL_DAMGE:
    default: 5
    formula: "5 + 1.5 * (level - 1) + 0.1 * INSIGHT"

resistances:
  PHYSICAL_RESISTANCE:
    default: 0
    formula: "ARMOR + 0.1 * (level - 1) + 0.1 * DEXTERITY"
  MAGICAL_RESISTANCE:
    default: 0
    formula: "0 + 0.1 * (level - 1) + 0.1 * INSIGHT"

utility:
  INVENTORY_SLOTS:
    default: 8

movement:
  RANGE:
    default: 1
    formula: "1 + 0.1 * DEXTERITY"
experience:
  XP:
    default: 0
    formula: "XP + 10 * (level - 1)"
  LEVEL:
    default: 1
    formula: "1 + XP / 100"
