# Define the source image files and their properties
spritesheets:
  creatures:
    resolution: 16
  items:
    resolution: 16
  maptiles:
    resolution: 16

# Define all game graphics. Size is assumed to be the default unless specified.
graphics:
  ################################
  # Sprites from 'creatures.png'
  ################################
  creatures:
    player_male:
      pos: [ 3, 1 ]
    rat:
      pos: [ 2, 2 ]
    naked_goblin:
      pos: [ 1, 3 ]
    coward_goblin:
      pos: [ 2, 3 ]
    armored_goblin:
      pos: [ 4, 3 ]
    # Example of how you would override the default for a larger creature:
    # big_demon:
    #   pos: [5, 5]
    #   size: [2, 2] 

  ################################
  # Sprites from 'items.png'
  ################################
  items:
    basic_sword:
      pos: [ 2, 8 ]
    claymore:
      pos: [ 3, 8 ]
    great_sword:
      pos: [ 4, 8 ]
    big_axe:
      pos: [ 5, 8 ]
    basic_staff:
      pos: [ 1, 12 ]
    basic_helm:
      pos: [ 1, 10 ]
    dwarf_helm:
      pos: [ 3, 10 ]
    knight_helm:
      pos: [ 6, 10 ]
    epic_helm:
      pos: [ 5, 11 ]
    base_armor:
      pos: [ 10, 10 ]
    brown_boots:
      pos: [ 6, 11 ]
    health_potion:
      pos: [ 12, 5 ]

  ################################
  # Sprites from 'maptiles.png'
  ################################
  maptiles:
    floor_tile1:
      pos: [ 3, 3 ]
    wall_tile1:
      pos: [ 2, 2 ]
    chair_w:
      pos: [ 6, 1 ]
    alchemy_table:
      pos: [ 6, 9 ]
    book_shelf:
      pos: [ 6, 8 ]